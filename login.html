
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Board - Account</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <a class="navbar-brand font-weight-bold" href="index.html">
        <i class="bi bi-briefcase-fill mr-2"></i> JobBoard
    </a>

    <div class="ml-auto">
        <a href="index.html" class="btn btn-outline-light rounded-pill px-4">
            <i class="bi bi-house mr-1"></i> Home
        </a>
    </div>

</nav>


<!-- ACCOUNT SECTION -->
<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 85vh;">

    <div class="account-card bg-white shadow p-4 p-md-5 rounded-lg">

        <!-- HEADER -->
        <div class="text-center mb-4">

            <div class="account-icon mb-3">
                <i class="bi bi-person-circle"></i>
            </div>

            <h2 class="font-weight-bold" id="formTitle">
                Create your account
            </h2>

            <p class="text-muted" id="formDescription">
                Join our platform and discover new opportunities.
            </p>

        </div>


        <!-- FORM -->
        <form id="accountForm">

            <!-- REGISTER FIELDS -->
            <div id="registerFields">

                <div class="form-group">
                    <label for="fullname">Full Name</label>

                    <input type="text"
                           class="form-control"
                           id="fullname"
                           placeholder="Enter your full name"
                           required>
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           placeholder="Enter your email"
                           required>
                </div>


                <div class="form-group">
                    <label for="role">Account Type</label>

                    <select class="form-control" id="role" required>
                        <option value="">Select account type</option>
                        <option value="Job Seeker">Job Seeker</option>
                        <option value="Employer">Employer / Recruiter</option>
                    </select>
                </div>


                <!-- EMPLOYER FIELD -->
                <div class="form-group" id="companyField" hidden>
                    <label for="company">Company Name</label>

                    <input type="text"
                           class="form-control"
                           id="company"
                           placeholder="Enter company name">
                </div>

            </div>


            <!-- LOGIN FIELDS -->
            <div id="loginFields" hidden>

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>

                    <input type="email"
                           class="form-control"
                           id="loginEmail"
                           placeholder="Enter your email">
                </div>

            </div>


            <!-- PASSWORD -->
            <div class="form-group">
                <label for="password">Password</label>

                <input type="password"
                       class="form-control"
                       id="password"
                       placeholder="Enter your password"
                       required>
            </div>


            <button type="submit"
                    class="btn btn-primary btn-block bg-dark border-0 rounded-pill py-2 font-weight-bold"
                    id="submitButton">

                Create Account

            </button>

        </form>


        <div id="result" class="text-center mt-3"></div>


        <!-- SWITCH LOGIN / REGISTER -->
        <div class="text-center mt-4">

            <span id="switchText" class="text-muted">
                Already have an account?
            </span>

            <button type="button"
                    id="switchButton"
                    class="btn btn-link font-weight-bold text-primary">
                Login
            </button>

        </div>

    </div>

</div>


<script src="test.js"></script>

</body>
</html>
